<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B 侧 AI 调试台 · CaveClass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Source+Serif+4:opsz,wght@8..60,300..700&display=swap">
  <link rel="stylesheet" href="assets/playground.css">
</head>
<body>
  <div class="shell">
    <header class="hdr">
      <div>
        <span class="badge">Dev only</span>
        <h1>B 侧 AI 调试台</h1>
        <p>仅供联调 <code>internal/ai</code>，不是讲师/学生产品页面。需在本地运行 <code>go run ./cmd/ai-playground</code>。</p>
      </div>
    </header>

    <div class="grid">
      <section class="panel">
        <h2>请求</h2>
        <div class="provider" id="providerRow">
          <label><input type="radio" name="provider" value="mock" checked> Mock</label>
          <label><input type="radio" name="provider" value="deepseek"> DeepSeek</label>
          <label><input type="radio" name="provider" value="teamily"> Teamily</label>
          <p class="hint" id="providerHint">正在检查密钥配置…</p>
        </div>

        <div class="tabs" role="tablist">
          <button type="button" class="is-on" data-tab="course">整课</button>
          <button type="button" data-tab="chapter">单章</button>
          <button type="button" data-tab="activity">Activity</button>
          <button type="button" data-tab="evaluate">质量评估</button>
        </div>

        <form id="formCourse" class="tab-panel">
          <div class="field">
            <label for="courseTopic">Topic</label>
            <input id="courseTopic" value="Git 入门" required>
          </div>
          <div class="field">
            <label for="courseAudience">Audience</label>
            <select id="courseAudience">
              <option value="NON_CS" selected>NON_CS</option>
              <option value="CS">CS</option>
              <option value="GENERAL">GENERAL</option>
            </select>
          </div>
          <div class="field">
            <label for="courseLang">Language</label>
            <select id="courseLang">
              <option value="zh-CN" selected>zh-CN</option>
              <option value="en-US">en-US</option>
            </select>
          </div>
          <div class="field">
            <label for="courseExtra">Extra requirements</label>
            <textarea id="courseExtra" placeholder="可选"></textarea>
          </div>
          <div class="field">
            <label for="courseChapters">Chapter count hint (0–30)</label>
            <input id="courseChapters" type="number" min="0" max="30" value="2">
          </div>
        </form>

        <form id="formChapter" class="tab-panel hidden">
          <div class="field">
            <label for="chapterTopic">Topic</label>
            <input id="chapterTopic" value="分支与合并">
          </div>
          <div class="field">
            <label for="chapterAudience">Audience</label>
            <select id="chapterAudience">
              <option value="NON_CS" selected>NON_CS</option>
              <option value="CS">CS</option>
              <option value="GENERAL">GENERAL</option>
            </select>
          </div>
          <div class="field">
            <label for="chapterKey">Target chapter key</label>
            <input id="chapterKey" value="ch-play-1">
          </div>
          <p class="hint">会使用浏览器里保存的「上次整课」作为 contextCourse（先跑整课）。</p>
        </form>

        <form id="formActivity" class="tab-panel hidden">
          <div class="field">
            <label for="actTopic">Topic</label>
            <input id="actTopic" value="查看仓库状态">
          </div>
          <div class="field">
            <label for="actAudience">Audience</label>
            <select id="actAudience">
              <option value="NON_CS" selected>NON_CS</option>
              <option value="CS">CS</option>
              <option value="GENERAL">GENERAL</option>
            </select>
          </div>
          <div class="field">
            <label for="actChapterKey">Target chapter key</label>
            <input id="actChapterKey" value="ch-play-1">
          </div>
          <div class="field">
            <label for="actKey">Target activity key</label>
            <input id="actKey" value="act-play-1">
          </div>
        </form>

        <form id="formEvaluate" class="tab-panel hidden">
          <div class="field">
            <label for="evalRubric">Rubric（可选）</label>
            <textarea id="evalRubric" placeholder="例如：练习是否具体"></textarea>
          </div>
          <p class="hint">使用「上次整课」JSON 作为评估对象；也可在右侧粘贴课程 JSON 后点「从右侧载入」。 </p>
        </form>

        <div class="actions">
          <button type="button" class="btn" id="runBtn">发送请求</button>
          <button type="button" class="btn btn--ghost" id="loadCourseBtn">从右侧载入课程</button>
        </div>
        <p class="status" id="statusLine"></p>
      </section>

      <section class="panel out">
        <h2>响应</h2>
        <pre id="output">{ "hint": "点击「发送请求」查看 code / data / meta" }</pre>
        <div class="meta-box hidden" id="metaBox"></div>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "b-ai:lastCourse";
    let activeTab = "course";
    let lastRawText = "";

    function provider() {
      const el = document.querySelector('input[name="provider"]:checked');
      return el ? el.value : "mock";
    }

    function setStatus(text, isErr) {
      const line = document.getElementById("statusLine");
      line.textContent = text || "";
      line.classList.toggle("err", !!isErr);
    }

    function showMeta(meta) {
      const box = document.getElementById("metaBox");
      if (!meta) {
        box.classList.add("hidden");
        return;
      }
      const warnings = (meta.warnings || []).length
        ? "<ul>" + meta.warnings.map((w) => "<li>" + escapeHtml(w) + "</li>").join("") + "</ul>"
        : "<p>无 warnings</p>";
      box.innerHTML =
        "<strong>Meta</strong><br>" +
        "modelUsed: " + escapeHtml(meta.modelUsed || "") +
        " · fallback: " + !!meta.fallbackUsed +
        " · latencyMs: " + (meta.latencyMs ?? "") +
        " · tokens: " + (meta.usage ? meta.usage.totalTokens : "") +
        "<br>warnings:" + warnings;
      box.classList.remove("hidden");
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function pretty(obj) {
      return JSON.stringify(obj, null, 2);
    }

    async function api(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const payload = await res.json();
      return { httpStatus: res.status, payload };
    }

    function savedCourse() {
      try {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function saveCourse(course) {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(course));
    }

    async function run() {
      const runBtn = document.getElementById("runBtn");
      runBtn.disabled = true;
      setStatus("请求中…（真实模型可能需 1–3 分钟）");
      const prov = provider();
      try {
        let path = "";
        let body = { provider: prov };
        if (activeTab === "course") {
          path = "/playground/generate-course";
          body = {
            provider: prov,
            topic: document.getElementById("courseTopic").value.trim(),
            audience: document.getElementById("courseAudience").value,
            language: document.getElementById("courseLang").value,
            extraRequirements: document.getElementById("courseExtra").value.trim(),
            chapterCountHint: Number(document.getElementById("courseChapters").value) || 0,
          };
        } else if (activeTab === "chapter") {
          path = "/playground/generate-chapter";
          body = {
            provider: prov,
            topic: document.getElementById("chapterTopic").value.trim(),
            audience: document.getElementById("chapterAudience").value,
            targetChapterKey: document.getElementById("chapterKey").value.trim(),
            contextCourse: savedCourse(),
          };
        } else if (activeTab === "activity") {
          path = "/playground/generate-activity";
          body = {
            provider: prov,
            topic: document.getElementById("actTopic").value.trim(),
            audience: document.getElementById("actAudience").value,
            targetChapterKey: document.getElementById("actChapterKey").value.trim(),
            targetActivityKey: document.getElementById("actKey").value.trim(),
            contextCourse: savedCourse(),
          };
        } else {
          path = "/playground/evaluate";
          const course = savedCourse();
          if (!course) {
            setStatus("请先生成整课，或从右侧 JSON 载入课程", true);
            runBtn.disabled = false;
            return;
          }
          body = {
            provider: prov,
            course,
            rubric: document.getElementById("evalRubric").value.trim(),
          };
        }

        const { httpStatus, payload } = await api(path, body);
        lastRawText = pretty(payload);
        document.getElementById("output").textContent = lastRawText;
        if (payload.code === 0 && payload.data) {
          setStatus("成功 HTTP " + httpStatus);
          showMeta(payload.data.meta);
          if (payload.data.course) {
            saveCourse(payload.data.course);
          }
        } else {
          setStatus((payload.msg || "失败") + " (HTTP " + httpStatus + ")", true);
          showMeta(null);
        }
      } catch (err) {
        setStatus("网络错误: " + err.message, true);
        showMeta(null);
      } finally {
        runBtn.disabled = false;
      }
    }

    function loadCourseFromOutput() {
      try {
        const parsed = JSON.parse(lastRawText || document.getElementById("output").textContent);
        const course =
          parsed.data?.course ||
          (parsed.schemaVersion ? parsed : null);
        if (!course || !course.schemaVersion) {
          setStatus("右侧 JSON 里没有课程对象", true);
          return;
        }
        saveCourse(course);
        setStatus("已保存为 contextCourse / 评估对象");
      } catch {
        setStatus("无法解析右侧 JSON", true);
      }
    }

    document.querySelectorAll(".tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeTab = btn.dataset.tab;
        document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("is-on", b === btn));
        document.querySelectorAll(".tab-panel").forEach((panel) => {
          const id = "form" + activeTab.charAt(0).toUpperCase() + activeTab.slice(1);
          panel.classList.toggle("hidden", panel.id !== id);
        });
      });
    });

    document.getElementById("runBtn").addEventListener("click", run);
    document.getElementById("loadCourseBtn").addEventListener("click", loadCourseFromOutput);

    fetch("/playground/providers")
      .then((r) => r.json())
      .then((res) => {
        const hint = document.getElementById("providerHint");
        if (res.code !== 0 || !res.data) {
          hint.textContent = "无法读取密钥状态（请确认 playground 服务已启动）";
          return;
        }
        const d = res.data;
        const parts = [
          "Mock 始终可用",
          d.deepseek
            ? "DeepSeek 密钥已配置"
            : "DeepSeek：设置 AI_DEEPSEEK_API_KEY，或 AI_PROVIDER=deepseek 且 AI_API_KEY",
          d.teamily
            ? "Teamily 密钥已配置"
            : "Teamily：设置 AI_TEAMILY_API_KEY，或 AI_PROVIDER=teamily 且 AI_API_KEY",
        ];
        hint.textContent = parts.join(" · ");
      })
      .catch(() => {
        document.getElementById("providerHint").textContent =
          "无法连接 playground API。在 backend 目录执行: go run ./cmd/ai-playground";
      });
  </script>
</body>
</html>
