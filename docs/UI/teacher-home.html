<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaveClass · Instructor home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Source+Serif+4:opsz,wght@8..60,300..700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>

<body>
<!-- ==================================================================
     Framework only. All three role home pages share this shell: a fixed
     sidebar on the left, a main column on the right holding a top bar and
     the content region. The content region is deliberately empty — no
     course data, no figures, no widgets have been built into it yet.
     The sidebar carries the three instructor entry points; each one is a
     label only and points nowhere.
     ================================================================== -->
<div class="app">

  <!-- ---------- left: sidebar ---------- -->
  <aside class="side">
    <div class="side-brand">
      <a class="brand" href="teacher-home.html" aria-label="CaveClass home">
        <span class="mark" aria-hidden="true">C</span>
        <span class="brand-text"><strong>CaveClass</strong><small>Instructor</small></span>
      </a>
    </div>

    <div class="nav-group">
      <p class="nav-title">Teach</p>
      <nav class="nav" aria-label="Instructor workspace">
        <a href="#" onclick="return false">Existing courses</a>
        <a href="#" onclick="return false">New course</a>
        <a href="#" onclick="return false">Student management</a>
      </nav>
    </div>

    <div class="side-foot">
      <a class="tlink signout" href="login.html">Sign out</a>
    </div>
  </aside>

  <!-- ---------- right: main ---------- -->
  <div class="main">
    <header class="appbar">
      <div class="crumbs">
        <span>Instructor</span><span class="sep">/</span><strong>Home</strong>
      </div>
    </header>

    <main class="content" aria-label="Instructor workspace"></main>
  </div>
</div>
</body>
</html>
